[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-builder"
version = "0.1.0"
description = "A universal repository builder for generating website and application source files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "anthropic>=0.34",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
repo-builder = "repo_builder.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_builder = ["templates/**/*"]
